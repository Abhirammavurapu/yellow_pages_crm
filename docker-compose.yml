services:
  mongodb:
    image: mongo:7.0
    container_name: crm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: yellow_pages_crm

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/yellow_pages_crm
      - JWT_SECRET=super_secure_yellow_pages_crm_jwt_secret_key_2024
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=http://localhost:3000
      - LOCK_DURATION_MINUTES=10
      - ADMIN_REGISTRATION_KEY=ADMIN2024
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
